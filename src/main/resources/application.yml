server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: nutrisync
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nutrisync}
    username: ${SPRING_DATASOURCE_USERNAME:nutrisync}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
app:
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
  seed-demo-data: ${APP_SEED_DEMO_DATA:false}
logging:
  level:
    org.springframework.security: WARN
