spring:
  datasource:
    url: jdbc:h2:mem:nutrisync-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: false
  main:
    allow-bean-definition-overriding: true
app:
  seed-demo-data: false
  time-zone: UTC
