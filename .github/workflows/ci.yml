name: Java CI

on:
  push:
    branches:
      - main
      - develop
      - "docs/**"
      - "feature/**"
      - "bugfix/**"
      - "ci/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run unit and integration tests
        run: mvn -B clean verify

      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-temporary-password-not-for-deployment
          POSTGRES_DB: nutrisync
          POSTGRES_USER: nutrisync
        run: docker compose config --quiet

      - name: Build container image
        run: docker build --pull -t nutrisync:ci .

      - name: Start isolated stack for Selenium journeys
        env:
          POSTGRES_PASSWORD: ci-only-temporary-password-not-for-deployment
          POSTGRES_DB: nutrisync
          POSTGRES_USER: nutrisync
          APP_HOST_PORT: "18080"
          SPRING_PROFILES_ACTIVE: demo
          APP_SEED_DEMO_DATA: "true"
          APP_BOOTSTRAP_STAFF_ENABLED: "false"
          COMPOSE_PROJECT_NAME: nutrisync-e2e
        run: docker compose --profile e2e up -d --build --wait

      - name: Run Selenium end-to-end journeys
        env:
          POSTGRES_PASSWORD: ci-only-temporary-password-not-for-deployment
          POSTGRES_DB: nutrisync
          POSTGRES_USER: nutrisync
          APP_HOST_PORT: "18080"
          SPRING_PROFILES_ACTIVE: demo
          APP_SEED_DEMO_DATA: "true"
          APP_BOOTSTRAP_STAFF_ENABLED: "false"
          COMPOSE_PROJECT_NAME: nutrisync-e2e
        run: mvn -B -Pselenium-e2e verify -De2e.enabled=true -De2e.baseUrl=http://nutrisync-web:8080 -De2e.remoteUrl=http://localhost:4444

      - name: Show Compose logs on failure
        if: failure()
        env:
          POSTGRES_PASSWORD: ci-only-temporary-password-not-for-deployment
          POSTGRES_DB: nutrisync
          POSTGRES_USER: nutrisync
          APP_HOST_PORT: "18080"
          COMPOSE_PROJECT_NAME: nutrisync-e2e
        run: docker compose --profile e2e logs --no-color app selenium db || true

      - name: Tear down isolated Selenium stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-only-temporary-password-not-for-deployment
          POSTGRES_DB: nutrisync
          POSTGRES_USER: nutrisync
          APP_HOST_PORT: "18080"
          COMPOSE_PROJECT_NAME: nutrisync-e2e
        run: docker compose --profile e2e down --volumes --remove-orphans

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nutrisync-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
